name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Wheels for tree-sitter / language-pack are prebuilt on all three OSes:
      # this step must never invoke a compiler.
      - name: Install (wheels only)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run test suite
        run: pytest -q

      - name: Server stdio smoke test
        shell: python
        run: |
          import json, subprocess, sys
          proc = subprocess.Popen(
              [sys.executable, "-m", "codeine.server"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL, text=True, encoding="utf-8")
          proc.stdin.write(json.dumps({
                  "jsonrpc": "2.0", "id": 1, "method": "initialize",
                  "params": {"protocolVersion": "2024-11-05",
                             "capabilities": {},
                             "clientInfo": {"name": "ci", "version": "0"}}}) + "\n")
          proc.stdin.flush()
          line = proc.stdout.readline()
          msg = json.loads(line)
          assert msg["result"]["serverInfo"]["name"] == "codeine"
          print("stdio handshake OK:", msg["result"]["serverInfo"])
          proc.stdin.close()
          proc.wait(timeout=10)
